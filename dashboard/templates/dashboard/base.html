<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Dashboard{% endblock %}</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
:root {
    --card-bg: rgba(255,255,255,0.82);
    --sidebar-bg: rgba(255,255,255,0.92);
    --text-main: #111827;
    --text-soft: #6b7280;
    --content-text: #111827;
    --accent: #9333ea;
}

body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    min-height: 100vh;
    background: linear-gradient(-45deg, #4c1d95, #6d28d9, #9333ea, #c084fc);
    background-size: 400% 400%;
    animation: gradientMove 12s ease infinite;
}

@keyframes gradientMove {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

.sidebar {
    min-height: 100vh;
    background: var(--sidebar-bg);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    border-right: 1px solid rgba(255,255,255,0.45);
    box-shadow: 8px 0 30px rgba(0,0,0,0.08);
}

.brand-title {
    color: var(--text-main);
    font-weight: 700;
    letter-spacing: -0.5px;
    animation: fadeSlide 1s ease;
}

.sidebar a,
.sidebar button {
    width: 100%;
    text-align: left;
    color: var(--text-main);
    text-decoration: none;
    display: block;
    padding: 12px 16px;
    margin-bottom: 10px;
    border-radius: 14px;
    font-weight: 600;
    transition: all 0.25s ease;
    background: transparent;
    border: none;
}

.sidebar a:hover,
.sidebar button:hover {
    background: rgba(147,51,234,0.10);
    transform: translateX(5px);
    color: var(--accent);
}

.logout-btn {
    margin-top: 25px;
}

.content-area {
    padding: 40px;
}

.topbar {
    background: rgba(255,255,255,0.18);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    border-radius: 24px;
    padding: 20px 28px;
    margin-bottom: 30px;
    border: 1px solid rgba(255,255,255,0.18);
    box-shadow: 0 10px 30px rgba(0,0,0,0.12);
}

.topbar h2 {
    margin: 0;
    color: white;
    font-size: 1.8rem;
    font-weight: 700;
    letter-spacing: -0.6px;
    animation: floatText 3s ease-in-out infinite;
}

.welcome-text {
    margin: 0;
    color: #ede9fe;
    animation: fadeSlide 1.2s ease;
}

.card,
.glass-card {
    background: var(--card-bg);
    border: none;
    border-radius: 24px;
    box-shadow: 0 12px 35px rgba(0,0,0,0.12);
    color: var(--content-text);
    animation: fadeUp 0.8s ease;
}

@keyframes fadeSlide {
    from { opacity: 0; transform: translateY(-12px); }
    to { opacity: 1; transform: translateY(0); }
}

@keyframes fadeUp {
    from { opacity: 0; transform: translateY(18px); }
    to { opacity: 1; transform: translateY(0); }
}

@keyframes floatText {
    0%,100% { transform: translateY(0px); }
    50% { transform: translateY(-3px); }
}

@media (max-width: 768px) {
    .sidebar { min-height: auto; }
    .content-area { padding: 20px; }
    .topbar h2 { font-size: 1.4rem; }
}
</style>
</head>

<body>

<div class="container-fluid">
<div class="row">

<div class="col-md-2 sidebar p-4">
<h4 class="brand-title mb-4">Admin Panel</h4>

<a href="{% url 'dashboard' %}">Dashboard</a>
<a href="#">Users</a>
<a href="#">Products</a>
<a href="#">Orders</a>

<form method="post" action="{% url 'logout' %}">
{% csrf_token %}
<button type="submit" class="logout-btn">Logout</button>
</form>
</div>

<div class="col-md-10 content-area">

<div class="topbar d-flex justify-content-between align-items-center flex-wrap gap-2">
<h2>{% block page_title %}Dashboard{% endblock %}</h2>
<p class="welcome-text">Welcome, {{ request.user.username }}</p>
</div>

{% block content %}
{% endblock %}

</div>
</div>
</div>

</body>
</html>
